<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#131D33"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Facet Gradients -->
    <linearGradient id="facet-top-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="facet-top-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="facet-bottom-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="facet-bottom-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Radar Pulse Wave Gradient -->
    <radialGradient id="pulse-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber Beacon Core Glow -->
    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect x="5" y="5" width="110" height="110" rx="26" fill="url(#ap-bg)" stroke="#334155" stroke-width="2"/>

  <!-- Radar / Cartographic Grounding Concentric Rings -->
  <circle cx="60" cy="54" r="44" fill="url(#pulse-glow)"/>
  <circle cx="60" cy="54" r="44" stroke="#0284C7" stroke-width="1" stroke-dasharray="2 3" opacity="0.35"/>
  <circle cx="60" cy="54" r="32" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.45"/>
  <circle cx="60" cy="54" r="20" stroke="#60A5FA" stroke-width="1.2" opacity="0.5"/>

  <!-- Crosshair & Coordinate Grid Latitude / Longitude lines -->
  <line x1="22" y1="54" x2="98" y2="54" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.3"/>
  <line x1="60" y1="16" x2="60" y2="92" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.3"/>

  <!-- Origami Faceted Map Navigator Pin -->
  <g filter="url(#glow)">
    <!-- Top-Left Facet -->
    <polygon points="60,20 34,50 60,60" fill="url(#facet-top-left)"/>
    <!-- Top-Right Facet -->
    <polygon points="60,20 86,50 60,60" fill="url(#facet-top-right)"/>
    <!-- Bottom-Left Facet -->
    <polygon points="34,50 60,60 60,94" fill="url(#facet-bottom-left)"/>
    <!-- Bottom-Right Facet -->
    <polygon points="86,50 60,60 60,94" fill="url(#facet-bottom-right)"/>
    <!-- Central Facet Edge Highlights -->
    <polyline points="60,20 60,94" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    <polyline points="34,50 60,60 86,50" stroke="#93C5FD" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Central Navigational Pulse Beacon (Spatial Grounding Node) -->
  <circle cx="60" cy="54" r="14" fill="url(#beacon-glow)"/>
  <circle cx="60" cy="54" r="4.5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1.8"/>
  <circle cx="60" cy="54" r="1.5" fill="#FFFFFF"/>

  <!-- Dynamic Active Pulse Wave Arcs -->
  <path d="M 88 34 A 38 38 0 0 1 96 54" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 94 28 A 46 46 0 0 1 104 54" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.5"/>
</svg>
